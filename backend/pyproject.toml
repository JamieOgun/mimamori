[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "click>=8.4.2",
    "fastapi>=0.139.2",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "pydantic-ai>=2.14.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlmodel>=0.0.39",
    "twilio>=9.10.9",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
